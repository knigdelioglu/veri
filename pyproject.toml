[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tde-dataset-factory"
version = "0.3.0"
description = "Türk Dili ve Edebiyatı rubrik notlandırma veri seti üretim ve kalite araçları"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.scripts]
veri = "dataset_factory.cli:main"

[tool.setuptools.packages.find]
include = ["dataset_factory*"]
