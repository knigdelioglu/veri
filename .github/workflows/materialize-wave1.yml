name: Materialize Pilot Wave 1

on:
  push:
    branches: [main]
    paths:
      - dataset_factory/materialize_wave1.py
      - tests/test_materialize_wave1.py
      - dataset_factory/materialize_wave1.trigger
      - .github/workflows/materialize-wave1.yml
  pull_request:
    branches: [main]
    paths:
      - dataset_factory/materialize_wave1.py
      - tests/test_materialize_wave1.py
      - dataset_factory/materialize_wave1.trigger
      - .github/workflows/materialize-wave1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test materializer
        run: python -m unittest discover -s tests -p 'test_materialize_wave1.py'
      - name: Materialize canonical records
        run: python -m dataset_factory.materialize_wave1 --root . --overwrite
      - name: Validate canonical dataset
        run: veri check
      - name: Commit canonical records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/records dataset/candidates/pilot-wave-1/manifest.json
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Wave 1 AI-verified canonical records"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
