name: Prepare Pilot Evaluation Split

on:
  pull_request:
    branches: [main]
    paths:
      - dataset_factory/evaluation_split.trigger
      - dataset_factory/production.py
      - tests/test_production.py
      - .github/workflows/prepare-pilot-evaluation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test production and split invariants
        run: python -m unittest discover -s tests -p 'test_production.py'
      - name: Assign group-aware pilot split
        run: veri split --train 0.8 --validation 0.1 --seed tde-pilot-v1
      - name: Check leakage
        run: veri leakage
      - name: Write split profile and evaluation review targets
        shell: bash
        run: |
          mkdir -p dataset/evaluation
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path('.')
          records=[]
          for modality in ('written','speaking','listening'):
              for path in sorted((root/'dataset'/'records'/modality).glob('*.json')):
                  records.append(json.loads(path.read_text(encoding='utf-8')))

          profile={'schema_version':'1.0','seed':'tde-pilot-v1','total':len(records),'splits':{}}
          review_targets=[]
          for split in ('train','validation','test'):
              rows=[r for r in records if r['metadata'].get('split')==split]
              profile['splits'][split]={
                  'records':len(rows),
                  'modality':dict(sorted(Counter(r['modality'] for r in rows).items())),
                  'grade':dict(sorted(Counter(str(r['grade']) for r in rows).items())),
                  'response_quality':dict(sorted(Counter(r['metadata']['response_quality'] for r in rows).items())),
                  'needs_review':sum(r['gold_evaluation']['needs_review'] is True for r in rows),
                  'hard_case':sum(bool(r['metadata']['hard_case_types']) for r in rows),
                  'adversarial':sum(r['metadata']['adversarial'] is True for r in rows),
                  'dual_review':sum(int(r['metadata']['review_count'])>=2 for r in rows),
                  'question_families':sorted(set(r['metadata']['question_family'] for r in rows)),
              }
              if split in {'validation','test'}:
                  for r in rows:
                      if int(r['metadata']['review_count']) < 2:
                          review_targets.append({
                              'id':r['id'],
                              'split':split,
                              'modality':r['modality'],
                              'grade':r['grade'],
                              'task_id':r['task']['task_id'],
                              'question_family':r['metadata']['question_family'],
                              'response_quality':r['metadata']['response_quality'],
                              'needs_review':r['gold_evaluation']['needs_review'],
                              'review_count':r['metadata']['review_count'],
                          })

          (root/'dataset'/'evaluation'/'pilot-split-profile.json').write_text(json.dumps(profile,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'dataset'/'evaluation'/'pilot-review-targets.json').write_text(json.dumps({'schema_version':'1.0','records':review_targets,'count':len(review_targets)},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(profile,ensure_ascii=False,indent=2))
          print(f'Evaluation records needing second AI review: {len(review_targets)}')
          PY
      - name: Commit preview split
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/records dataset/splits dataset/evaluation
          if git diff --cached --quiet; then
            echo "No split changes to commit."
            exit 0
          fi
          git commit -m "Prepare pilot evaluation split preview"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
