name: Materialize Pilot Wave 5

on:
  pull_request:
    branches: [main]
    paths:
      - dataset_factory/materialize_pilot_batch.py
      - tests/test_materialize_pilot_batch.py
      - tests/test_materialize_pilot_wave3.py
      - tests/test_materialize_pilot_wave4.py
      - tests/test_materialize_pilot_wave5.py
      - schemas/canonical-record.schema.json
      - dataset/candidates/pilot-wave-5/**
      - dataset_factory/materialize_wave5.trigger
      - .github/workflows/materialize-wave5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Regression test Wave 2 materializer
        run: python -m unittest discover -s tests -p 'test_materialize_pilot_batch.py'
      - name: Regression test Wave 3 materializer
        run: python -m unittest discover -s tests -p 'test_materialize_pilot_wave3.py'
      - name: Regression test Wave 4 materializer
        run: python -m unittest discover -s tests -p 'test_materialize_pilot_wave4.py'
      - name: Test Wave 5 materializer
        run: python -m unittest discover -s tests -p 'test_materialize_pilot_wave5.py'
      - name: Materialize Wave 5
        run: python -m dataset_factory.materialize_pilot_batch --root . --batch pilot-wave-5 --overwrite
      - name: Validate complete 500-record canonical dataset
        run: veri check
      - name: Check leakage invariants
        run: veri leakage
      - name: Report and enforce final pilot quota
        shell: bash
        run: |
          veri quota --phase pilot --json > /tmp/pilot-quota.json
          cat /tmp/pilot-quota.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/pilot-quota.json'))
          assert q['verified_records'] == 500
          assert q['remaining_to_phase_target'] == 0
          assert {k:v['actual'] for k,v in q['by_modality'].items()} == {'written':250,'speaking':125,'listening':125}
          assert {k:v['actual'] for k,v in q['by_grade'].items()} == {'9':125,'10':125,'11':125,'12':125}
          assert {k:v['actual'] for k,v in q['by_response_quality'].items()} == {'full_correct':100,'high_partial':100,'mid_partial':100,'low_partial':75,'incorrect':50,'blank_irrelevant':25,'borderline':50}
          assert q['target_ranges']['needs_review']['actual'] == 40
          assert q['target_ranges']['needs_review']['status'] == 'in_range'
          assert q['target_ranges']['hard_case']['actual'] == 91
          assert q['target_ranges']['hard_case']['status'] == 'in_range'
          assert q['target_ranges']['adversarial']['actual'] == 20
          assert q['target_ranges']['adversarial']['status'] == 'in_range'
          assert q['coverage']['question_families']['unique'] == 24
          assert q['coverage']['exact_tasks']['unique'] == 48
          assert q['rubric_diversity']['distinct_criterion_counts'] >= 4
          print('FINAL PILOT QUOTA: PASS')
          PY
      - name: Commit canonical Wave 5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/records dataset/candidates/pilot-wave-5/manifest.json
          if git diff --cached --quiet; then
            echo "No Wave 5 materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Pilot Wave 5 AI-verified records"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
