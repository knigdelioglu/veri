name: Materialize Pilot Wave 2

on:
  pull_request:
    branches: [main]
    paths:
      - dataset/candidates/pilot-wave-2/**
      - dataset_factory/materialize_pilot_batch.py
      - tests/test_materialize_pilot_batch.py
      - dataset_factory/materialize_wave2.trigger
      - .github/workflows/materialize-pilot-wave2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test generic materializer
        run: python -m unittest discover -s tests -p 'test_materialize_pilot_batch.py'
      - name: Materialize Wave 2
        run: python -m dataset_factory.materialize_pilot_batch --root . --batch pilot-wave-2 --overwrite
      - name: Validate complete canonical dataset
        run: veri check
      - name: Report pilot quota
        run: veri quota --phase pilot --json
      - name: Commit canonical Wave 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/records dataset/candidates/pilot-wave-2/manifest.json
          if git diff --cached --quiet; then
            echo "No Wave 2 materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize Pilot Wave 2 AI-verified records"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push
          fi
