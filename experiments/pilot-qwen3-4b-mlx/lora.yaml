model: "mlx-community/Qwen3-4B-4bit"
train: true
fine_tune_type: lora
optimizer: adamw
data: "experiments/pilot-qwen3-4b-mlx/data"
seed: 42

# 16 GB Apple Silicon için muhafazakâr başlangıç profili.
num_layers: 8
batch_size: 1
grad_accumulation_steps: 4
iters: 160
val_batches: -1
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 20
save_every: 40
adapter_path: "experiments/pilot-qwen3-4b-mlx/adapters"

# Test seti burada kesinlikle kullanılmaz; final test yalnız model/checkpoint seçimi bittikten sonra evaluator ile açılır.
test: false
test_batches: 0

max_seq_length: 2048
grad_checkpoint: true

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.0
